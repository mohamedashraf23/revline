<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon / app-icon variant. The standalone mark loses its needle below ~20px,
    so this one sits on a filled tile: shorter radius (9 not 11) and a heavier
    stroke (4 not 3.2) to hold up at 16px.
  -->
  <!-- Hex, not oklch: favicons get rendered by tooling well outside the browser. -->
  <rect width="32" height="32" rx="7" fill="#D75928" />
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M8.63 21.16A9 9 0 0 1 23.37 10.84" stroke-width="4" stroke-opacity="0.5" />
    <path d="M23.37 10.84A9 9 0 0 1 23.37 21.16" stroke-width="4" />
    <path d="M16 16L22.85 14.55" stroke-width="4" />
  </g>
  <circle cx="16" cy="16" r="2.2" fill="#fff" />
</svg>
